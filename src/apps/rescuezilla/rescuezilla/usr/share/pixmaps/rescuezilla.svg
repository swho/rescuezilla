<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 100 100">

  <defs>
    <linearGradient id="navyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090F1D"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#162440"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="lightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="30%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="72%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <g transform="translate(0,0) scale(1.0)">
    <!-- Outer rounded tech shield -->
    <path d="M50 4 L90 19 L90 53 C90 76 72 91 50 97 C28 91 10 76 10 53 L10 19 Z"
          fill="url(#shieldBg)" stroke="url(#cyanGrad)" stroke-width="4.2" stroke-linejoin="round"/>
    <!-- Inner subtle rim -->
    <path d="M50 11 L83 23.5 L83 52.5 C83 71.5 68 84 50 89.5 C32 84 17 71.5 17 52.5 L17 23.5 Z"
          fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Bottom disk layer (Full Base) -->
    <path d="M27 61 L50 72 L73 61 L73 68 L50 79 L27 68 Z" fill="#0284C7"/>
    <path d="M27 61 L50 50 L73 61 L50 72 Z" fill="#0EA5E9" fill-opacity="0.88"/>
    <!-- Middle disk layer (Seekable Index) -->
    <path d="M27 48 L50 59 L73 48 L73 54.5 L50 65.5 L27 54.5 Z" fill="#0369A1"/>
    <path d="M27 48 L50 37 L73 48 L50 59 Z" fill="#38BDF8" fill-opacity="0.92"/>
    <!-- Top disk layer (Emerald Differential Delta Slice) -->
    <path d="M27 35 L50 46 L73 35 L73 41 L50 52 L27 41 Z" fill="#059669"/>
    <path d="M27 35 L50 24 L73 35 L50 46 Z" fill="#34D399"/>
    <!-- Snap Lightning Bolt cutting through layers -->
    <polygon points="56,16 37,48 49,48 43,78 65,43 52,43"
             fill="#F8FAFC" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
</svg>
